name: Check social integration
on:
  pull_request:
  push:
    branches: [social/connect-x-youtube]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check tweet-metrics.js && node tests/test_social_ui.cjs
      - run: python scripts/build_site.py _site
      - run: git diff --check
